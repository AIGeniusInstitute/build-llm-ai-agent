# 绑定地址，0.0.0.0 表示监听所有网络接口
bind 0.0.0.0

# 端口号
port 6379

# 是否以守护进程模式运行
daemonize yes

# 日志文件路径
logfile "redis.log"

# 数据库数量
databases 16

# 持久化配置，AOF（Append Only File）持久化
appendonly yes
appendfilename "appendonly.aof"

# 加载 RedisJSON 模块，需替换为实际的模块路径
# 若使用 Redis 8.0+，此配置可省略
#loadmodule /path/to/redisjson.so

# 加载 RediSearch 模块，需替换为实际的模块路径
# 若使用 Redis 8.0+，此配置可省略
#loadmodule /path/to/redisearch.so

# 最大内存限制，根据实际情况调整
maxmemory 2gb

# 内存淘汰策略，当内存不足时移除最近最少使用的键
maxmemory-policy allkeys-lru
